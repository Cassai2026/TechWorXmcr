name: Update Nodes Active Count

on:
  push:
    paths:
      - 'nodes/**'

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count Sponsor files and update index.html
        run: |
          # Count files in /nodes that start with "Sponsor" (case-insensitive)
          COUNT=$(find nodes -maxdepth 1 -type f -iname "Sponsor*" | wc -l | tr -d ' ')
          echo "Sponsor file count: $COUNT"

          # Replace the number between <span id="nodes-active">...</span>
          sed -i "s|<span id=\"nodes-active\">[0-9]*</span>|<span id=\"nodes-active\">${COUNT}</span>|g" index.html

          echo "Updated index.html:"
          grep 'nodes-active' index.html

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update Nodes Active count to $(grep -oP '(?<=nodes-active\">)\d+' index.html)"
          git push
