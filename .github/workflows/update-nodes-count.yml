name: Update Nodes Active Count

on:
  push:
    paths:
      - 'nodes/**'

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot itself to prevent infinite loops
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count Sponsor files and update index.html
        run: |
          # Count files in /nodes that start with "Sponsor" (case-insensitive)
          COUNT=$(find nodes -maxdepth 1 -type f -iname "Sponsor*" | wc -l | tr -d ' ')
          echo "Sponsor file count: $COUNT"

          # Replace the number between <span id="nodes-active">...</span>
          sed -i "s|<span id=\"nodes-active\">[0-9]*</span>|<span id=\"nodes-active\">${COUNT}</span>|g" index.html

          echo "Updated index.html:"
          grep 'nodes-active' index.html

      - name: Commit and push updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            COUNT_IN_FILE=$(sed -n 's/.*<span id="nodes-active">\([0-9]*\)<\/span>.*/\1/p' index.html)
            git commit -m "chore: update Nodes Active count to ${COUNT_IN_FILE}"
          fi
          git push
